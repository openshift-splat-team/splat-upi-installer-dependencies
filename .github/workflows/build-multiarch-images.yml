name: Build multi-architecture govc and pwsh images

on:
  pull_request:
    paths:
      - '.github/workflows/build-multiarch-images.yml'
      - 'images/govc/**'
      - 'images/pwsh/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-multiarch-images.yml'
      - 'images/govc/**'
      - 'images/pwsh/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: govc
            file: images/govc/Containerfile
            tag: v0.30.7
          - image: pwsh
            file: images/pwsh/Containerfile
            tag: v7.3.12
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ocp-splat+splat_team_push
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          tags: quay.io/ocp-splat/${{ matrix.image }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify the published multi-architecture index
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          IMAGE: quay.io/ocp-splat/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64") != null)
              and ($platforms | index("linux/arm64") != null)
          ' manifest.json
